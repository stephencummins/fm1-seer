# Once a day: read The Firmware Hub's catalogue, rebuild the seer and put it on seer.stephen8n.com.
# The hub asks for at most one read of catalog.json a day, so this is the only thing that runs refresh.py on a clock.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit) and CLOUDFLARE_ACCOUNT_ID.
name: refresh
on:
  schedule:
    - cron: "17 13 * * *"   # 13:17 UTC, after the hub's midday update
  workflow_dispatch:
permissions:
  contents: write
concurrency: refresh
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the catalogue
        run: python3 refresh.py
      - name: Build
        run: python3 build.py
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name seer --branch main --commit-dirty=true
      - name: Keep the list in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/firmwares.json src/data/asof.txt
          git diff --cached --quiet || { git commit -m "Firmware list: $(cat src/data/asof.txt)"; git push; }
